<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Spanner - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #673ab7; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #673ab7; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(103,58,183,0.1); border: 1px solid #673ab7; color: #673ab7; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(103,58,183,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Cloud Spanner</h1>
        <p>Globally distributed relational database. Watch data replicate across regions with strong consistency via TrueTime.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let regions = [], replicationParticles = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 30);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x673ab7, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Create regions (globe-like distribution)
            const regionData = [
                { name: 'US', x: -10, z: 0, color: 0x673ab7 },
                { name: 'EU', x: 5, z: -8, color: 0x673ab7 },
                { name: 'Asia', x: 10, z: 5, color: 0x673ab7 }
            ];
            
            regionData.forEach((r, i) => {
                const geom = new THREE.IcosahedronGeometry(3, 1);
                const mat = new THREE.MeshPhongMaterial({ color: r.color, emissive: r.color, emissiveIntensity: 0.3 });
                const region = new THREE.Mesh(geom, mat);
                region.position.set(r.x, 0, r.z);
                regions.push(region);
                scene.add(region);
                
                // Connect regions
                regionData.forEach((r2, j) => {
                    if (j > i) {
                        const points = [new THREE.Vector3(r.x, 0, r.z), new THREE.Vector3(r2.x, 0, r2.z)];
                        const lineGeom = new THREE.BufferGeometry().setFromPoints(points);
                        const lineMat = new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.5 });
                        scene.add(new THREE.Line(lineGeom, lineMat));
                    }
                });
            });
            
            // Replication particles
            for (let i = 0; i < 30; i++) {
                const geom = new THREE.SphereGeometry(0.2);
                const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const p = new THREE.Mesh(geom, mat);
                p.userData = { from: Math.floor(Math.random() * 3), to: Math.floor(Math.random() * 3), progress: Math.random() };
                if (p.userData.from === p.userData.to) p.userData.to = (p.userData.to + 1) % 3;
                replicationParticles.push(p);
                scene.add(p);
            }
            
            const grid = new THREE.GridHelper(40, 40, 0x673ab7, 0x1a1a2e);
            grid.position.y = -8;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                regions.forEach(r => { r.rotation.y += 0.01; r.rotation.x += 0.005; });
                
                replicationParticles.forEach(p => {
                    p.userData.progress += 0.01;
                    if (p.userData.progress > 1) {
                        p.userData.progress = 0;
                        p.userData.from = p.userData.to;
                        p.userData.to = Math.floor(Math.random() * 3);
                        if (p.userData.from === p.userData.to) p.userData.to = (p.userData.to + 1) % 3;
                    }
                    const from = regions[p.userData.from].position;
                    const to = regions[p.userData.to].position;
                    const t = p.userData.progress;
                    p.position.x = from.x + (to.x - from.x) * t;
                    p.position.y = Math.sin(t * Math.PI) * 5;
                    p.position.z = from.z + (to.z - from.z) * t;
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function resetCamera() { camera.position.set(0, 20, 30); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
