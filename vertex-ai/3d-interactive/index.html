<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex AI ML Pipeline - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #9c27b0; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #9c27b0; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(156,39,176,0.1); border: 1px solid #9c27b0; color: #9c27b0; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(156,39,176,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Vertex AI ML Pipeline</h1>
        <p>Watch data flow through an ML pipeline: Data Prep → Feature Engineering → Training → Evaluation → Deployment.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let stages = [], particles = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x9c27b0, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            const stageData = [
                { x: -12, color: 0x2196f3, name: 'Data' },
                { x: -6, color: 0x4caf50, name: 'Features' },
                { x: 0, color: 0x9c27b0, name: 'Training' },
                { x: 6, color: 0xff9800, name: 'Evaluation' },
                { x: 12, color: 0x00bcd4, name: 'Deploy' }
            ];
            
            stageData.forEach((s, i) => {
                const geom = new THREE.TorusKnotGeometry(1.5, 0.5, 64, 8);
                const mat = new THREE.MeshPhongMaterial({ color: s.color, emissive: s.color, emissiveIntensity: 0.3 });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.set(s.x, 0, 0);
                stages.push(mesh);
                scene.add(mesh);
                
                if (i < stageData.length - 1) {
                    const points = [new THREE.Vector3(s.x + 2, 0, 0), new THREE.Vector3(stageData[i+1].x - 2, 0, 0)];
                    const lineGeom = new THREE.BufferGeometry().setFromPoints(points);
                    const lineMat = new THREE.LineBasicMaterial({ color: 0x444444 });
                    scene.add(new THREE.Line(lineGeom, lineMat));
                }
            });
            
            for (let i = 0; i < 100; i++) {
                const geom = new THREE.SphereGeometry(0.15);
                const mat = new THREE.MeshBasicMaterial({ color: 0x9c27b0 });
                const p = new THREE.Mesh(geom, mat);
                p.position.set(-15 + Math.random() * 2, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
                p.userData = { speed: 0.05 + Math.random() * 0.05 };
                particles.push(p);
                scene.add(p);
            }
            
            const grid = new THREE.GridHelper(40, 40, 0x9c27b0, 0x1a1a2e);
            grid.position.y = -5;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                stages.forEach(s => { s.rotation.x += 0.01; s.rotation.y += 0.005; });
                particles.forEach(p => {
                    p.position.x += p.userData.speed;
                    if (p.position.x > 15) p.position.x = -15;
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function resetCamera() { camera.position.set(0, 15, 25); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
