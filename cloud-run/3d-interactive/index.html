<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Run - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #2979ff; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #2979ff; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(41,121,255,0.1); border: 1px solid #2979ff; color: #2979ff; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(41,121,255,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Cloud Run Autoscaling</h1>
        <p>Watch containers scale from zero based on incoming requests. Each container handles multiple concurrent requests.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="scaleUp()">Increase Load</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let containers = [], requests = [];
        let targetContainers = 3;
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x2979ff, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            updateContainers();
            
            const grid = new THREE.GridHelper(40, 40, 0x2979ff, 0x1a1a2e);
            grid.position.y = -5;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            setInterval(spawnRequest, 500);
            animate();
        }
        
        function updateContainers() {
            // Remove excess containers
            while (containers.length > targetContainers) {
                const c = containers.pop();
                scene.remove(c);
            }
            // Add new containers
            while (containers.length < targetContainers) {
                const geom = new THREE.BoxGeometry(2, 3, 2);
                const mat = new THREE.MeshPhongMaterial({ color: 0x2979ff, emissive: 0x2979ff, emissiveIntensity: 0.2 });
                const container = new THREE.Mesh(geom, mat);
                const idx = containers.length;
                container.position.set((idx - (targetContainers - 1) / 2) * 4, 0, 0);
                containers.push(container);
                scene.add(container);
            }
            // Reposition
            containers.forEach((c, i) => {
                c.position.x = (i - (containers.length - 1) / 2) * 4;
            });
        }
        
        function spawnRequest() {
            if (containers.length === 0) return;
            const geom = new THREE.SphereGeometry(0.2);
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const req = new THREE.Mesh(geom, mat);
            req.position.set((Math.random() - 0.5) * 20, 15, (Math.random() - 0.5) * 10);
            req.userData = { target: containers[Math.floor(Math.random() * containers.length)], speed: 0.2 };
            requests.push(req);
            scene.add(req);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                containers.forEach(c => c.rotation.y += 0.01);
                
                requests.forEach((r, i) => {
                    const target = r.userData.target;
                    if (target) {
                        const dx = target.position.x - r.position.x;
                        const dy = target.position.y - r.position.y;
                        const dz = target.position.z - r.position.z;
                        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                        
                        if (dist < 1) {
                            target.material.emissiveIntensity = 0.6;
                            setTimeout(() => target.material.emissiveIntensity = 0.2, 100);
                            scene.remove(r);
                            requests.splice(i, 1);
                        } else {
                            r.position.x += dx / dist * r.userData.speed;
                            r.position.y += dy / dist * r.userData.speed;
                            r.position.z += dz / dist * r.userData.speed;
                        }
                    }
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function scaleUp() { targetContainers = Math.min(targetContainers + 2, 10); updateContainers(); }
        function resetCamera() { camera.position.set(0, 15, 25); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
