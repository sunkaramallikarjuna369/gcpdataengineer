<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Functions - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #00c853; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #00c853; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(0,200,83,0.1); border: 1px solid #00c853; color: #00c853; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(0,200,83,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Cloud Functions</h1>
        <p>Serverless event-driven functions. Watch events trigger function executions that scale automatically.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="triggerEvent()">Trigger Event</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let functionNodes = [], events = [], executions = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x00c853, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Function nodes (lambda symbols)
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const geom = new THREE.TorusKnotGeometry(1, 0.3, 64, 8);
                const mat = new THREE.MeshPhongMaterial({ color: 0x00c853, emissive: 0x00c853, emissiveIntensity: 0.2 });
                const node = new THREE.Mesh(geom, mat);
                node.position.set(Math.cos(angle) * 8, 0, Math.sin(angle) * 8);
                node.userData = { angle, active: false };
                functionNodes.push(node);
                scene.add(node);
            }
            
            // Event sources (center)
            const eventGeom = new THREE.IcosahedronGeometry(2, 1);
            const eventMat = new THREE.MeshPhongMaterial({ color: 0x4285f4, emissive: 0x4285f4, emissiveIntensity: 0.3, wireframe: true });
            const eventSource = new THREE.Mesh(eventGeom, eventMat);
            scene.add(eventSource);
            
            const grid = new THREE.GridHelper(40, 40, 0x00c853, 0x1a1a2e);
            grid.position.y = -5;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            setInterval(triggerEvent, 2000);
            animate();
        }
        
        function triggerEvent() {
            const targetNode = functionNodes[Math.floor(Math.random() * functionNodes.length)];
            
            // Create event particle
            const geom = new THREE.SphereGeometry(0.3);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const event = new THREE.Mesh(geom, mat);
            event.position.set(0, 0, 0);
            event.userData = { target: targetNode, progress: 0 };
            events.push(event);
            scene.add(event);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                functionNodes.forEach(n => {
                    n.rotation.x += 0.01;
                    n.rotation.y += 0.02;
                });
                
                events.forEach((e, i) => {
                    e.userData.progress += 0.03;
                    const t = e.userData.progress;
                    const target = e.userData.target;
                    
                    e.position.x = target.position.x * t;
                    e.position.y = Math.sin(t * Math.PI) * 5;
                    e.position.z = target.position.z * t;
                    
                    if (t >= 1) {
                        // Trigger function execution
                        target.material.emissiveIntensity = 0.8;
                        setTimeout(() => target.material.emissiveIntensity = 0.2, 500);
                        scene.remove(e);
                        events.splice(i, 1);
                    }
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function resetCamera() { camera.position.set(0, 15, 25); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
