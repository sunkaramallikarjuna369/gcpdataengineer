<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Composer DAG - 3D Interactive Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #017cee;
            border-radius: 10px;
            padding: 20px;
            max-width: 320px;
            z-index: 100;
        }
        #info-panel h1 { color: #017cee; font-size: 1.4em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #dag-status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ff00;
            border-radius: 10px;
            padding: 15px;
            z-index: 100;
        }
        #dag-status h3 { color: #00ff00; margin-bottom: 10px; }
        .task-status { display: flex; align-items: center; margin: 8px 0; font-size: 0.85em; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; }
        .status-success { background: #00ff00; }
        .status-running { background: #ffff00; animation: pulse 1s infinite; }
        .status-pending { background: #888; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        .control-btn {
            background: rgba(1, 124, 238, 0.1);
            border: 1px solid #017cee;
            color: #017cee;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .control-btn:hover { background: rgba(1, 124, 238, 0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="info-panel">
        <h1>DAG Execution Flow</h1>
        <p>Visualize a Directed Acyclic Graph (DAG) executing tasks. Watch data flow through the pipeline as tasks complete.</p>
        <p style="margin-top: 10px; color: #017cee;">Click tasks to see details.</p>
    </div>

    <div id="dag-status">
        <h3>DAG: daily_etl_pipeline</h3>
        <div class="task-status">
            <div class="status-dot status-success"></div>
            <span>extract_data</span>
        </div>
        <div class="task-status">
            <div class="status-dot status-success"></div>
            <span>transform_data</span>
        </div>
        <div class="task-status">
            <div class="status-dot status-running"></div>
            <span>load_to_bigquery</span>
        </div>
        <div class="task-status">
            <div class="status-dot status-pending"></div>
            <span>validate_data</span>
        </div>
        <div class="task-status">
            <div class="status-dot status-pending"></div>
            <span>send_notification</span>
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="triggerDag()">Trigger DAG</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let tasks = [];
        let connections = [];
        let dataParticles = [];
        let isAnimating = true;

        const taskData = [
            { name: 'extract', x: -12, y: 0, z: 0, color: 0x00ff00 },
            { name: 'transform', x: -4, y: 3, z: 0, color: 0x00ff00 },
            { name: 'load', x: 4, y: 0, z: 0, color: 0xffff00 },
            { name: 'validate', x: 12, y: 3, z: 0, color: 0x888888 },
            { name: 'notify', x: 12, y: -3, z: 0, color: 0x888888 }
        ];

        const edges = [
            [0, 1], [0, 2], [1, 2], [2, 3], [2, 4]
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lights
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x017cee, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);

            // Create task nodes
            taskData.forEach((task, i) => {
                const geometry = new THREE.DodecahedronGeometry(1.5);
                const material = new THREE.MeshPhongMaterial({
                    color: task.color,
                    emissive: task.color,
                    emissiveIntensity: 0.3
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(task.x, task.y, task.z);
                mesh.userData = { name: task.name, index: i };
                tasks.push(mesh);
                scene.add(mesh);

                // Add glow
                const glowGeom = new THREE.DodecahedronGeometry(2);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: task.color,
                    transparent: true,
                    opacity: 0.1
                });
                const glow = new THREE.Mesh(glowGeom, glowMat);
                mesh.add(glow);
            });

            // Create connections
            edges.forEach(([from, to]) => {
                const start = new THREE.Vector3(taskData[from].x, taskData[from].y, taskData[from].z);
                const end = new THREE.Vector3(taskData[to].x, taskData[to].y, taskData[to].z);
                
                const points = [start, end];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ 
                    color: 0x017cee, 
                    transparent: true, 
                    opacity: 0.5 
                });
                const line = new THREE.Line(geometry, material);
                connections.push(line);
                scene.add(line);
            });

            // Create data flow particles
            for (let i = 0; i < 50; i++) {
                const geometry = new THREE.SphereGeometry(0.2);
                const material = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.8
                });
                const particle = new THREE.Mesh(geometry, material);
                particle.userData = {
                    edge: Math.floor(Math.random() * edges.length),
                    progress: Math.random(),
                    speed: 0.005 + Math.random() * 0.01
                };
                dataParticles.push(particle);
                scene.add(particle);
            }

            // Grid
            const grid = new THREE.GridHelper(40, 40, 0x017cee, 0x1a1a2e);
            grid.position.y = -5;
            scene.add(grid);

            window.addEventListener('resize', onResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isAnimating) {
                // Rotate task nodes
                tasks.forEach(task => {
                    task.rotation.y += 0.01;
                    task.rotation.x += 0.005;
                });

                // Animate data particles along edges
                dataParticles.forEach(particle => {
                    const edge = edges[particle.userData.edge];
                    const start = taskData[edge[0]];
                    const end = taskData[edge[1]];
                    
                    particle.userData.progress += particle.userData.speed;
                    if (particle.userData.progress > 1) {
                        particle.userData.progress = 0;
                        particle.userData.edge = Math.floor(Math.random() * edges.length);
                    }

                    const t = particle.userData.progress;
                    particle.position.x = start.x + (end.x - start.x) * t;
                    particle.position.y = start.y + (end.y - start.y) * t;
                    particle.position.z = start.z + (end.z - start.z) * t;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleAnimation() {
            isAnimating = !isAnimating;
            event.target.textContent = isAnimating ? 'Pause' : 'Resume';
        }

        function triggerDag() {
            // Reset all tasks to pending, then animate through
            tasks.forEach((task, i) => {
                setTimeout(() => {
                    task.material.color.setHex(0x00ff00);
                    task.material.emissive.setHex(0x00ff00);
                }, i * 1000);
            });
        }

        function resetCamera() {
            camera.position.set(0, 10, 25);
            controls.target.set(0, 0, 0);
        }

        init();
    </script>
</body>
</html>
