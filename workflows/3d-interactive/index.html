<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Workflows - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #7c4dff; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #7c4dff; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(124,77,255,0.1); border: 1px solid #7c4dff; color: #7c4dff; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(124,77,255,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Cloud Workflows</h1>
        <p>Serverless orchestration. Watch workflow steps execute in sequence with branching and error handling.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="executeWorkflow()">Execute</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let steps = [], connections = [], executionToken;
        let currentStep = 0;
        
        const stepData = [
            { x: -10, y: 3, name: 'Start', color: 0x4caf50 },
            { x: -5, y: 3, name: 'Extract', color: 0x7c4dff },
            { x: 0, y: 5, name: 'Transform A', color: 0x7c4dff },
            { x: 0, y: 1, name: 'Transform B', color: 0x7c4dff },
            { x: 5, y: 3, name: 'Load', color: 0x7c4dff },
            { x: 10, y: 3, name: 'End', color: 0xea4335 }
        ];
        
        const connData = [[0,1], [1,2], [1,3], [2,4], [3,4], [4,5]];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 20);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x7c4dff, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Create steps
            stepData.forEach((s, i) => {
                const geom = i === 0 || i === stepData.length - 1 ? 
                    new THREE.SphereGeometry(1) : new THREE.BoxGeometry(2, 1.5, 1);
                const mat = new THREE.MeshPhongMaterial({ color: s.color, emissive: s.color, emissiveIntensity: 0.2 });
                const step = new THREE.Mesh(geom, mat);
                step.position.set(s.x, s.y, 0);
                steps.push(step);
                scene.add(step);
            });
            
            // Create connections
            connData.forEach(([from, to]) => {
                const start = new THREE.Vector3(stepData[from].x, stepData[from].y, 0);
                const end = new THREE.Vector3(stepData[to].x, stepData[to].y, 0);
                const geom = new THREE.BufferGeometry().setFromPoints([start, end]);
                const mat = new THREE.LineBasicMaterial({ color: 0x444444 });
                const line = new THREE.Line(geom, mat);
                connections.push({ line, from, to });
                scene.add(line);
            });
            
            // Execution token
            const tokenGeom = new THREE.SphereGeometry(0.5);
            const tokenMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            executionToken = new THREE.Mesh(tokenGeom, tokenMat);
            executionToken.position.copy(steps[0].position);
            executionToken.visible = false;
            scene.add(executionToken);
            
            const grid = new THREE.GridHelper(40, 40, 0x7c4dff, 0x1a1a2e);
            grid.position.y = -3;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                steps.forEach(s => s.rotation.y += 0.01);
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function executeWorkflow() {
            executionToken.visible = true;
            currentStep = 0;
            moveToNextStep();
        }
        
        function moveToNextStep() {
            if (currentStep >= steps.length) {
                executionToken.visible = false;
                return;
            }
            
            const target = steps[currentStep].position;
            const start = executionToken.position.clone();
            let progress = 0;
            
            steps[currentStep].material.emissiveIntensity = 0.8;
            
            const animateMove = () => {
                progress += 0.05;
                if (progress >= 1) {
                    executionToken.position.copy(target);
                    steps[currentStep].material.emissiveIntensity = 0.2;
                    currentStep++;
                    setTimeout(moveToNextStep, 300);
                    return;
                }
                executionToken.position.lerpVectors(start, target, progress);
                requestAnimationFrame(animateMove);
            };
            animateMove();
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function resetCamera() { camera.position.set(0, 10, 20); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
