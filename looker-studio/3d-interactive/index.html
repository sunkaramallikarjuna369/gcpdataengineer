<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looker Studio - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #4285f4; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #4285f4; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(66,133,244,0.1); border: 1px solid #4285f4; color: #4285f4; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(66,133,244,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Looker Studio Dashboard</h1>
        <p>Interactive dashboard visualization. Watch data flow from BigQuery to charts and graphs in real-time.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="refreshData()">Refresh Data</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let chartBars = [], pieSlices = [], dataSource, dataFlows = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x4285f4, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Data source (BigQuery)
            const sourceGeom = new THREE.BoxGeometry(3, 2, 3);
            const sourceMat = new THREE.MeshPhongMaterial({ color: 0x4285f4, emissive: 0x4285f4, emissiveIntensity: 0.3 });
            dataSource = new THREE.Mesh(sourceGeom, sourceMat);
            dataSource.position.set(0, -5, 0);
            scene.add(dataSource);
            
            // Bar chart
            const barColors = [0x4285f4, 0xea4335, 0xfbbc04, 0x34a853, 0x9c27b0];
            for (let i = 0; i < 5; i++) {
                const height = 2 + Math.random() * 4;
                const geom = new THREE.BoxGeometry(1, height, 1);
                const mat = new THREE.MeshPhongMaterial({ color: barColors[i], emissive: barColors[i], emissiveIntensity: 0.2 });
                const bar = new THREE.Mesh(geom, mat);
                bar.position.set(-8 + i * 2, height / 2, 0);
                bar.userData = { targetHeight: height };
                chartBars.push(bar);
                scene.add(bar);
            }
            
            // Pie chart (simplified as segments)
            for (let i = 0; i < 4; i++) {
                const geom = new THREE.CylinderGeometry(2, 2, 0.5, 32, 1, false, i * Math.PI / 2, Math.PI / 2);
                const mat = new THREE.MeshPhongMaterial({ color: barColors[i], emissive: barColors[i], emissiveIntensity: 0.2 });
                const slice = new THREE.Mesh(geom, mat);
                slice.position.set(8, 2, 0);
                slice.rotation.x = Math.PI / 2;
                pieSlices.push(slice);
                scene.add(slice);
            }
            
            // Data flows
            for (let i = 0; i < 30; i++) {
                const geom = new THREE.SphereGeometry(0.15);
                const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const flow = new THREE.Mesh(geom, mat);
                flow.userData = { target: Math.random() > 0.5 ? 'bar' : 'pie', progress: Math.random() };
                dataFlows.push(flow);
                scene.add(flow);
            }
            
            const grid = new THREE.GridHelper(40, 40, 0x4285f4, 0x1a1a2e);
            grid.position.y = -8;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                dataSource.rotation.y += 0.01;
                pieSlices.forEach(s => s.parent && (s.rotation.z += 0.01));
                
                dataFlows.forEach(f => {
                    f.userData.progress += 0.02;
                    if (f.userData.progress > 1) f.userData.progress = 0;
                    
                    const t = f.userData.progress;
                    const targetX = f.userData.target === 'bar' ? -4 : 8;
                    const targetY = f.userData.target === 'bar' ? 3 : 2;
                    
                    f.position.x = dataSource.position.x + (targetX - dataSource.position.x) * t;
                    f.position.y = dataSource.position.y + (targetY - dataSource.position.y) * t + Math.sin(t * Math.PI) * 3;
                    f.position.z = Math.sin(t * Math.PI * 2) * 2;
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        
        function refreshData() {
            chartBars.forEach(bar => {
                bar.userData.targetHeight = 2 + Math.random() * 4;
                const newHeight = bar.userData.targetHeight;
                bar.scale.y = newHeight / bar.geometry.parameters.height;
                bar.position.y = newHeight / 2;
            });
        }
        
        function resetCamera() { camera.position.set(0, 15, 25); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
