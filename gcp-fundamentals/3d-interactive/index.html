<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCP Resource Hierarchy - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #4285f4;
            border-radius: 10px;
            padding: 20px;
            max-width: 320px;
            z-index: 100;
        }
        #info-panel h1 { color: #4285f4; font-size: 1.4em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #legend {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
            z-index: 100;
        }
        #legend h4 { color: #fff; margin-bottom: 10px; }
        .legend-item { display: flex; align-items: center; margin: 8px 0; font-size: 0.8em; }
        .legend-color { width: 20px; height: 20px; border-radius: 4px; margin-right: 10px; }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        .control-btn {
            background: rgba(66, 133, 244, 0.1);
            border: 1px solid #4285f4;
            color: #4285f4;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .control-btn:hover { background: rgba(66, 133, 244, 0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="info-panel">
        <h1>GCP Resource Hierarchy</h1>
        <p>Explore the hierarchical structure of GCP resources. Organization at the top, flowing down through Folders, Projects, and individual Resources.</p>
        <p style="margin-top: 10px; color: #4285f4;">IAM policies inherit downward through the hierarchy.</p>
    </div>

    <div id="legend">
        <h4>Resource Types</h4>
        <div class="legend-item">
            <div class="legend-color" style="background: #ea4335;"></div>
            <span>Organization</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #fbbc04;"></div>
            <span>Folder</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #4285f4;"></div>
            <span>Project</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #34a853;"></div>
            <span>Resource</span>
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="expandAll()">Expand All</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let nodes = [];
        let connections = [];
        let isAnimating = true;

        const hierarchy = {
            name: 'Organization',
            color: 0xea4335,
            y: 12,
            children: [
                {
                    name: 'Engineering',
                    color: 0xfbbc04,
                    y: 6,
                    x: -8,
                    children: [
                        { name: 'data-prod', color: 0x4285f4, y: 0, x: -12, resources: ['BigQuery', 'Dataflow', 'GCS'] },
                        { name: 'data-dev', color: 0x4285f4, y: 0, x: -4, resources: ['BigQuery', 'GCS'] }
                    ]
                },
                {
                    name: 'Analytics',
                    color: 0xfbbc04,
                    y: 6,
                    x: 8,
                    children: [
                        { name: 'analytics-prod', color: 0x4285f4, y: 0, x: 4, resources: ['BigQuery', 'Looker'] },
                        { name: 'ml-platform', color: 0x4285f4, y: 0, x: 12, resources: ['Vertex AI', 'GCS'] }
                    ]
                }
            ]
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0xffffff, 1, 100);
            light.position.set(0, 30, 20);
            scene.add(light);

            createHierarchy(hierarchy, 0, 0);

            const grid = new THREE.GridHelper(40, 40, 0x4285f4, 0x1a1a2e);
            grid.position.y = -8;
            scene.add(grid);

            window.addEventListener('resize', onResize);
            animate();
        }

        function createHierarchy(node, x, z) {
            // Create node
            const geometry = node.resources ? new THREE.SphereGeometry(0.8, 16, 16) : new THREE.BoxGeometry(2, 1, 2);
            const material = new THREE.MeshPhongMaterial({
                color: node.color,
                emissive: node.color,
                emissiveIntensity: 0.3
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(node.x || x, node.y, z);
            mesh.userData = { name: node.name };
            nodes.push(mesh);
            scene.add(mesh);

            // Create resources if any
            if (node.resources) {
                node.resources.forEach((res, i) => {
                    const resGeom = new THREE.OctahedronGeometry(0.5);
                    const resMat = new THREE.MeshPhongMaterial({
                        color: 0x34a853,
                        emissive: 0x34a853,
                        emissiveIntensity: 0.3
                    });
                    const resMesh = new THREE.Mesh(resGeom, resMat);
                    resMesh.position.set((node.x || x) + (i - 1) * 1.5, node.y - 4, z);
                    nodes.push(resMesh);
                    scene.add(resMesh);

                    // Connection to project
                    createConnection(mesh.position, resMesh.position);
                });
            }

            // Process children
            if (node.children) {
                node.children.forEach((child, i) => {
                    createHierarchy(child, child.x || x, z);
                    
                    // Create connection
                    const childPos = new THREE.Vector3(child.x || x, child.y, z);
                    createConnection(mesh.position, childPos);
                });
            }
        }

        function createConnection(start, end) {
            const points = [start.clone(), end.clone()];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ 
                color: 0x666666, 
                transparent: true, 
                opacity: 0.5 
            });
            const line = new THREE.Line(geometry, material);
            connections.push(line);
            scene.add(line);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isAnimating) {
                nodes.forEach((node, i) => {
                    node.rotation.y += 0.005;
                    node.position.y += Math.sin(Date.now() * 0.001 + i) * 0.002;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleAnimation() {
            isAnimating = !isAnimating;
            event.target.textContent = isAnimating ? 'Pause' : 'Resume';
        }

        function expandAll() {
            nodes.forEach(node => {
                node.scale.multiplyScalar(1.2);
                setTimeout(() => node.scale.divideScalar(1.2), 500);
            });
        }

        function resetCamera() {
            camera.position.set(0, 15, 30);
            controls.target.set(0, 0, 0);
        }

        init();
    </script>
</body>
</html>
