<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Manager - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #ffd600; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #ffd600; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(255,214,0,0.1); border: 1px solid #ffd600; color: #ffd600; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(255,214,0,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Secret Manager</h1>
        <p>Secure vault for credentials. Watch secrets being accessed with proper authentication and audit logging.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="accessSecret()">Access Secret</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let vault, secrets = [], accessBeams = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0xffd600, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Vault (central secure storage)
            const vaultGeom = new THREE.BoxGeometry(6, 6, 6);
            const vaultMat = new THREE.MeshPhongMaterial({ color: 0x333333, emissive: 0xffd600, emissiveIntensity: 0.1 });
            vault = new THREE.Mesh(vaultGeom, vaultMat);
            scene.add(vault);
            
            // Secrets inside vault
            for (let i = 0; i < 8; i++) {
                const geom = new THREE.OctahedronGeometry(0.5);
                const mat = new THREE.MeshBasicMaterial({ color: 0xffd600 });
                const secret = new THREE.Mesh(geom, mat);
                const angle = (i / 8) * Math.PI * 2;
                secret.position.set(Math.cos(angle) * 1.5, Math.sin(angle) * 1.5, 0);
                secret.userData = { angle, radius: 1.5 };
                secrets.push(secret);
                scene.add(secret);
            }
            
            // Shield effect
            const shieldGeom = new THREE.IcosahedronGeometry(4, 1);
            const shieldMat = new THREE.MeshBasicMaterial({ color: 0xffd600, wireframe: true, transparent: true, opacity: 0.3 });
            const shield = new THREE.Mesh(shieldGeom, shieldMat);
            scene.add(shield);
            
            const grid = new THREE.GridHelper(40, 40, 0xffd600, 0x1a1a2e);
            grid.position.y = -8;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                vault.rotation.y += 0.005;
                
                secrets.forEach(s => {
                    s.userData.angle += 0.02;
                    s.position.x = Math.cos(s.userData.angle) * s.userData.radius;
                    s.position.y = Math.sin(s.userData.angle) * s.userData.radius;
                    s.rotation.x += 0.02;
                    s.rotation.y += 0.02;
                });
                
                accessBeams.forEach((beam, i) => {
                    beam.userData.progress += 0.05;
                    if (beam.userData.progress > 1) {
                        scene.remove(beam);
                        accessBeams.splice(i, 1);
                    } else {
                        beam.scale.x = beam.userData.progress;
                        beam.material.opacity = 1 - beam.userData.progress;
                    }
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function accessSecret() {
            // Create access beam from outside to vault
            const beamGeom = new THREE.CylinderGeometry(0.1, 0.1, 15, 8);
            const beamMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 });
            const beam = new THREE.Mesh(beamGeom, beamMat);
            beam.rotation.z = Math.PI / 2;
            beam.position.set(-7.5, 0, 0);
            beam.userData = { progress: 0 };
            accessBeams.push(beam);
            scene.add(beam);
            
            // Flash vault
            vault.material.emissiveIntensity = 0.5;
            setTimeout(() => vault.material.emissiveIntensity = 0.1, 500);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function resetCamera() { camera.position.set(0, 15, 25); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
