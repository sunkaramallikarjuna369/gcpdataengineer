<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Processing - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #00e676; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #00e676; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(0,230,118,0.1); border: 1px solid #00e676; color: #00e676; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(0,230,118,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Streaming Pipeline</h1>
        <p>Watch real-time events flow through windows. Events are grouped by time windows and aggregated before output.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let windows = [], events = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x00e676, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Time windows (sliding along)
            for (let i = 0; i < 5; i++) {
                const geom = new THREE.BoxGeometry(4, 6, 4);
                const mat = new THREE.MeshPhongMaterial({ color: 0x00e676, emissive: 0x00e676, emissiveIntensity: 0.2, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
                const win = new THREE.Mesh(geom, mat);
                win.position.set(-10 + i * 5, 0, 0);
                win.userData = { baseX: win.position.x };
                windows.push(win);
                scene.add(win);
            }
            
            // Streaming events
            for (let i = 0; i < 150; i++) {
                const geom = new THREE.SphereGeometry(0.2);
                const mat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0x00e676 : 0x00bcd4 });
                const event = new THREE.Mesh(geom, mat);
                event.position.set(-20 + Math.random() * 5, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
                event.userData = { speed: 0.1 + Math.random() * 0.1, offset: Math.random() * Math.PI * 2 };
                events.push(event);
                scene.add(event);
            }
            
            const grid = new THREE.GridHelper(40, 40, 0x00e676, 0x1a1a2e);
            grid.position.y = -8;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                // Move windows
                windows.forEach(w => {
                    w.position.x += 0.02;
                    if (w.position.x > 15) w.position.x = -15;
                });
                
                // Move events through pipeline
                events.forEach(e => {
                    e.position.x += e.userData.speed;
                    e.position.y += Math.sin(Date.now() * 0.005 + e.userData.offset) * 0.02;
                    if (e.position.x > 20) {
                        e.position.x = -20;
                        e.position.y = (Math.random() - 0.5) * 8;
                    }
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function resetCamera() { camera.position.set(0, 15, 30); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
