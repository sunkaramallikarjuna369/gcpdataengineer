<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigQuery Advanced - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #4285f4; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #4285f4; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(66,133,244,0.1); border: 1px solid #4285f4; color: #4285f4; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(66,133,244,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>BigQuery Query Execution</h1>
        <p>Visualize query optimization. Watch how partitioning and clustering reduce data scanned and improve performance.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="runQuery()">Run Query</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let partitions = [], queryBeam;
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 30);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x4285f4, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Create partitioned table visualization
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 6; col++) {
                    const geom = new THREE.BoxGeometry(2, 1, 2);
                    const mat = new THREE.MeshPhongMaterial({ 
                        color: 0x4285f4, 
                        emissive: 0x4285f4, 
                        emissiveIntensity: 0.1,
                        transparent: true,
                        opacity: 0.7
                    });
                    const partition = new THREE.Mesh(geom, mat);
                    partition.position.set((col - 2.5) * 2.5, 0, (row - 1.5) * 2.5);
                    partition.userData = { row, col, scanned: false };
                    partitions.push(partition);
                    scene.add(partition);
                }
            }
            
            // Query beam
            const beamGeom = new THREE.CylinderGeometry(0.1, 0.5, 15, 32);
            const beamMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
            queryBeam = new THREE.Mesh(beamGeom, beamMat);
            queryBeam.position.set(-10, 8, 0);
            queryBeam.rotation.z = Math.PI / 2;
            scene.add(queryBeam);
            
            const grid = new THREE.GridHelper(40, 40, 0x4285f4, 0x1a1a2e);
            grid.position.y = -3;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                queryBeam.position.x += 0.1;
                if (queryBeam.position.x > 15) queryBeam.position.x = -15;
                
                partitions.forEach(p => {
                    const dist = Math.abs(p.position.x - queryBeam.position.x);
                    if (dist < 2) {
                        p.material.emissiveIntensity = 0.5;
                        p.scale.y = 1.5;
                    } else {
                        p.material.emissiveIntensity = 0.1;
                        p.scale.y = 1;
                    }
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        
        function runQuery() {
            // Highlight only specific partitions (simulating partition pruning)
            partitions.forEach(p => {
                if (p.userData.col >= 2 && p.userData.col <= 4) {
                    p.material.color.setHex(0x00ff00);
                    p.material.emissive.setHex(0x00ff00);
                } else {
                    p.material.color.setHex(0x333333);
                    p.material.emissive.setHex(0x333333);
                }
            });
            setTimeout(() => {
                partitions.forEach(p => {
                    p.material.color.setHex(0x4285f4);
                    p.material.emissive.setHex(0x4285f4);
                });
            }, 2000);
        }
        
        function resetCamera() { camera.position.set(0, 20, 30); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
