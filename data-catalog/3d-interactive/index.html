<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Catalog - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #7c4dff; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #7c4dff; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(124,77,255,0.1); border: 1px solid #7c4dff; color: #7c4dff; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(124,77,255,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Data Catalog</h1>
        <p>Explore your data assets. Each node represents a table, dataset, or resource. Lines show data lineage connections.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let assets = [], lineageLines = [], searchRing;
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 30);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x7c4dff, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Data assets (nodes in a network)
            const assetTypes = [
                { color: 0x4285f4, count: 8 },  // BigQuery tables
                { color: 0x34a853, count: 5 },  // GCS buckets
                { color: 0xfbbc04, count: 4 },  // Pub/Sub topics
            ];
            
            assetTypes.forEach((type, typeIdx) => {
                for (let i = 0; i < type.count; i++) {
                    const angle = (i / type.count) * Math.PI * 2 + typeIdx * 0.5;
                    const radius = 8 + typeIdx * 4;
                    const geom = new THREE.OctahedronGeometry(1);
                    const mat = new THREE.MeshPhongMaterial({ color: type.color, emissive: type.color, emissiveIntensity: 0.3 });
                    const asset = new THREE.Mesh(geom, mat);
                    asset.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 6, Math.sin(angle) * radius);
                    asset.userData = { angle, radius, typeIdx };
                    assets.push(asset);
                    scene.add(asset);
                }
            });
            
            // Lineage connections
            for (let i = 0; i < 20; i++) {
                const from = assets[Math.floor(Math.random() * assets.length)];
                const to = assets[Math.floor(Math.random() * assets.length)];
                if (from !== to) {
                    const points = [from.position.clone(), to.position.clone()];
                    const geom = new THREE.BufferGeometry().setFromPoints(points);
                    const mat = new THREE.LineBasicMaterial({ color: 0x7c4dff, transparent: true, opacity: 0.3 });
                    const line = new THREE.Line(geom, mat);
                    lineageLines.push({ line, from, to });
                    scene.add(line);
                }
            }
            
            // Search ring
            const ringGeom = new THREE.RingGeometry(12, 12.5, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x7c4dff, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
            searchRing = new THREE.Mesh(ringGeom, ringMat);
            searchRing.rotation.x = Math.PI / 2;
            scene.add(searchRing);
            
            const grid = new THREE.GridHelper(40, 40, 0x7c4dff, 0x1a1a2e);
            grid.position.y = -8;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                assets.forEach(a => {
                    a.rotation.y += 0.02;
                    a.position.y += Math.sin(Date.now() * 0.001 + a.userData.angle) * 0.01;
                });
                
                lineageLines.forEach(l => {
                    const positions = l.line.geometry.attributes.position.array;
                    positions[0] = l.from.position.x;
                    positions[1] = l.from.position.y;
                    positions[2] = l.from.position.z;
                    positions[3] = l.to.position.x;
                    positions[4] = l.to.position.y;
                    positions[5] = l.to.position.z;
                    l.line.geometry.attributes.position.needsUpdate = true;
                });
                
                searchRing.rotation.z += 0.005;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function resetCamera() { camera.position.set(0, 20, 30); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
