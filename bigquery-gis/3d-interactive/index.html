<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigQuery GIS - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #00c853; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #00c853; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(0,200,83,0.1); border: 1px solid #00c853; color: #00c853; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(0,200,83,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>BigQuery GIS</h1>
        <p>Geospatial analytics visualization. Watch spatial queries find points within polygons and calculate distances.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="runSpatialQuery()">Run Query</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let globe, points = [], queryCircle;
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x00c853, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Globe/map representation
            const globeGeom = new THREE.SphereGeometry(8, 32, 32);
            const globeMat = new THREE.MeshPhongMaterial({ color: 0x1a1a2e, emissive: 0x1a1a2e, emissiveIntensity: 0.1, wireframe: true });
            globe = new THREE.Mesh(globeGeom, globeMat);
            scene.add(globe);
            
            // Geographic points
            for (let i = 0; i < 100; i++) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = Math.random() * Math.PI * 2;
                const geom = new THREE.SphereGeometry(0.15);
                const mat = new THREE.MeshBasicMaterial({ color: 0x4285f4 });
                const point = new THREE.Mesh(geom, mat);
                point.position.setFromSphericalCoords(8.2, phi, theta);
                point.userData = { phi, theta, selected: false };
                points.push(point);
                scene.add(point);
            }
            
            // Query circle (geofence)
            const circleGeom = new THREE.RingGeometry(2, 2.2, 64);
            const circleMat = new THREE.MeshBasicMaterial({ color: 0x00c853, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
            queryCircle = new THREE.Mesh(circleGeom, circleMat);
            queryCircle.position.set(0, 0, 8.5);
            scene.add(queryCircle);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                globe.rotation.y += 0.002;
                
                // Rotate points with globe
                points.forEach(p => {
                    p.userData.theta += 0.002;
                    p.position.setFromSphericalCoords(8.2, p.userData.phi, p.userData.theta);
                });
                
                // Move query circle
                queryCircle.position.x = Math.sin(Date.now() * 0.001) * 5;
                queryCircle.position.y = Math.cos(Date.now() * 0.0007) * 3;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        
        function runSpatialQuery() {
            // Highlight points within query circle
            points.forEach(p => {
                const dist = p.position.distanceTo(queryCircle.position);
                if (dist < 3) {
                    p.material.color.setHex(0x00ff00);
                    p.scale.set(2, 2, 2);
                } else {
                    p.material.color.setHex(0x4285f4);
                    p.scale.set(1, 1, 1);
                }
            });
            
            setTimeout(() => {
                points.forEach(p => {
                    p.material.color.setHex(0x4285f4);
                    p.scale.set(1, 1, 1);
                });
            }, 2000);
        }
        
        function resetCamera() { camera.position.set(0, 15, 25); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
