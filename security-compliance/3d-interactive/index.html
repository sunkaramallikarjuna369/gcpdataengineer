<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security & Compliance - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #ea4335; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #ea4335; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(234,67,53,0.1); border: 1px solid #ea4335; color: #ea4335; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(234,67,53,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Security Perimeter</h1>
        <p>Visualize VPC Service Controls protecting your data. The shield represents the security perimeter, blocking unauthorized access.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="simulateAttack()">Simulate Attack</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let shield, protectedAssets = [], threats = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0xea4335, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Security shield (perimeter)
            const shieldGeom = new THREE.TorusGeometry(10, 0.3, 16, 100);
            const shieldMat = new THREE.MeshPhongMaterial({ color: 0x4285f4, emissive: 0x4285f4, emissiveIntensity: 0.3, transparent: true, opacity: 0.6 });
            shield = new THREE.Mesh(shieldGeom, shieldMat);
            shield.rotation.x = Math.PI / 2;
            scene.add(shield);
            
            // Protected assets inside
            const assetColors = [0x34a853, 0xfbbc04, 0x4285f4];
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const geom = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                const mat = new THREE.MeshPhongMaterial({ color: assetColors[i % 3], emissive: assetColors[i % 3], emissiveIntensity: 0.3 });
                const asset = new THREE.Mesh(geom, mat);
                asset.position.set(Math.cos(angle) * 5, 0, Math.sin(angle) * 5);
                protectedAssets.push(asset);
                scene.add(asset);
            }
            
            // Threats (outside trying to get in)
            for (let i = 0; i < 20; i++) {
                const geom = new THREE.TetrahedronGeometry(0.5);
                const mat = new THREE.MeshBasicMaterial({ color: 0xea4335 });
                const threat = new THREE.Mesh(geom, mat);
                const angle = Math.random() * Math.PI * 2;
                const radius = 15 + Math.random() * 5;
                threat.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 10, Math.sin(angle) * radius);
                threat.userData = { angle, radius, speed: 0.01 + Math.random() * 0.02, blocked: false };
                threats.push(threat);
                scene.add(threat);
            }
            
            const grid = new THREE.GridHelper(40, 40, 0xea4335, 0x1a1a2e);
            grid.position.y = -8;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                shield.rotation.z += 0.005;
                
                protectedAssets.forEach(a => {
                    a.rotation.y += 0.01;
                    a.rotation.x += 0.005;
                });
                
                threats.forEach(t => {
                    t.userData.angle += t.userData.speed;
                    // Try to move toward center but get blocked at perimeter
                    const targetRadius = t.userData.blocked ? 12 : t.userData.radius - 0.02;
                    if (targetRadius < 10) {
                        t.userData.blocked = true;
                        t.material.color.setHex(0x888888);
                    }
                    t.userData.radius = Math.max(targetRadius, 10.5);
                    t.position.x = Math.cos(t.userData.angle) * t.userData.radius;
                    t.position.z = Math.sin(t.userData.angle) * t.userData.radius;
                    t.rotation.x += 0.05;
                    t.rotation.y += 0.05;
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        
        function simulateAttack() {
            threats.forEach(t => {
                t.userData.radius = 15 + Math.random() * 5;
                t.userData.blocked = false;
                t.material.color.setHex(0xea4335);
            });
        }
        
        function resetCamera() { camera.position.set(0, 15, 30); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
