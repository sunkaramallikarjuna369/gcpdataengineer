<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Data Fusion - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #ff6d00; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #ff6d00; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(255,109,0,0.1); border: 1px solid #ff6d00; color: #ff6d00; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(255,109,0,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Data Fusion Pipeline</h1>
        <p>Visual ETL pipeline builder. Drag-and-drop components connect sources to transforms to sinks.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let components = [], connections = [], dataParticles = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0xff6d00, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Pipeline components
            const compData = [
                { x: -10, y: 0, type: 'source', color: 0x4285f4 },
                { x: -3, y: 3, type: 'transform', color: 0xff6d00 },
                { x: -3, y: -3, type: 'transform', color: 0xff6d00 },
                { x: 4, y: 0, type: 'transform', color: 0xff6d00 },
                { x: 11, y: 0, type: 'sink', color: 0x34a853 }
            ];
            
            compData.forEach((c, i) => {
                const geom = c.type === 'source' ? new THREE.CylinderGeometry(1.5, 1.5, 1, 32) :
                             c.type === 'sink' ? new THREE.BoxGeometry(2.5, 2.5, 1) :
                             new THREE.OctahedronGeometry(1.5);
                const mat = new THREE.MeshPhongMaterial({ color: c.color, emissive: c.color, emissiveIntensity: 0.3 });
                const comp = new THREE.Mesh(geom, mat);
                comp.position.set(c.x, c.y, 0);
                if (c.type === 'source') comp.rotation.x = Math.PI / 2;
                components.push(comp);
                scene.add(comp);
            });
            
            // Connections
            const connData = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4]];
            connData.forEach(([from, to]) => {
                const start = new THREE.Vector3(compData[from].x, compData[from].y, 0);
                const end = new THREE.Vector3(compData[to].x, compData[to].y, 0);
                const geom = new THREE.BufferGeometry().setFromPoints([start, end]);
                const mat = new THREE.LineBasicMaterial({ color: 0x666666 });
                const line = new THREE.Line(geom, mat);
                connections.push({ line, from: compData[from], to: compData[to] });
                scene.add(line);
            });
            
            // Data particles
            for (let i = 0; i < 60; i++) {
                const geom = new THREE.SphereGeometry(0.2);
                const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                const p = new THREE.Mesh(geom, mat);
                const connIdx = Math.floor(Math.random() * connData.length);
                p.userData = { connIdx, progress: Math.random(), speed: 0.015 + Math.random() * 0.02 };
                dataParticles.push(p);
                scene.add(p);
            }
            
            const grid = new THREE.GridHelper(40, 40, 0xff6d00, 0x1a1a2e);
            grid.position.y = -8;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                components.forEach(c => c.rotation.y += 0.01);
                
                dataParticles.forEach(p => {
                    p.userData.progress += p.userData.speed;
                    if (p.userData.progress > 1) {
                        p.userData.progress = 0;
                        p.userData.connIdx = Math.floor(Math.random() * connections.length);
                    }
                    const conn = connections[p.userData.connIdx];
                    const t = p.userData.progress;
                    p.position.x = conn.from.x + (conn.to.x - conn.from.x) * t;
                    p.position.y = conn.from.y + (conn.to.y - conn.from.y) * t;
                    p.position.z = Math.sin(t * Math.PI) * 2;
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function resetCamera() { camera.position.set(0, 15, 25); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
