<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigQuery ML - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #ff9800; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #ff9800; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(255,152,0,0.1); border: 1px solid #ff9800; color: #ff9800; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(255,152,0,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>BigQuery ML</h1>
        <p>Machine Learning with SQL. Watch as data transforms into trained models and predictions flow out.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let model, dataPoints = [], predictions = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0xff9800, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Central model (brain-like structure)
            const modelGeom = new THREE.IcosahedronGeometry(3, 1);
            const modelMat = new THREE.MeshPhongMaterial({ color: 0xff9800, emissive: 0xff9800, emissiveIntensity: 0.4, wireframe: true });
            model = new THREE.Mesh(modelGeom, modelMat);
            scene.add(model);
            
            // Data points flowing in
            for (let i = 0; i < 100; i++) {
                const geom = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const mat = new THREE.MeshBasicMaterial({ color: 0x4285f4 });
                const p = new THREE.Mesh(geom, mat);
                const angle = Math.random() * Math.PI * 2;
                const radius = 15 + Math.random() * 5;
                p.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 10, Math.sin(angle) * radius);
                p.userData = { angle, radius, speed: 0.01 + Math.random() * 0.01 };
                dataPoints.push(p);
                scene.add(p);
            }
            
            // Predictions flowing out
            for (let i = 0; i < 50; i++) {
                const geom = new THREE.OctahedronGeometry(0.2);
                const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const p = new THREE.Mesh(geom, mat);
                p.position.set(0, 0, 0);
                p.userData = { angle: Math.random() * Math.PI * 2, radius: 0, speed: 0.1 + Math.random() * 0.1, active: false, delay: i * 20 };
                predictions.push(p);
                scene.add(p);
            }
            
            const grid = new THREE.GridHelper(40, 40, 0xff9800, 0x1a1a2e);
            grid.position.y = -8;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        let frame = 0;
        function animate() {
            requestAnimationFrame(animate);
            frame++;
            if (isAnimating) {
                model.rotation.x += 0.005;
                model.rotation.y += 0.01;
                
                dataPoints.forEach(p => {
                    p.userData.radius -= 0.05;
                    if (p.userData.radius < 3) p.userData.radius = 20;
                    p.position.x = Math.cos(p.userData.angle) * p.userData.radius;
                    p.position.z = Math.sin(p.userData.angle) * p.userData.radius;
                    p.userData.angle += p.userData.speed;
                });
                
                predictions.forEach(p => {
                    if (frame > p.userData.delay) {
                        p.userData.radius += p.userData.speed;
                        if (p.userData.radius > 20) { p.userData.radius = 0; p.userData.angle = Math.random() * Math.PI * 2; }
                        p.position.x = Math.cos(p.userData.angle) * p.userData.radius;
                        p.position.z = Math.sin(p.userData.angle) * p.userData.radius;
                    }
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function resetCamera() { camera.position.set(0, 15, 25); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
