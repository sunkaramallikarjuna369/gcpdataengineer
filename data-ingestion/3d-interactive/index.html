<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Ingestion - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100%; height: 100vh; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #2196f3; border-radius: 10px; padding: 20px; max-width: 300px; z-index: 100; }
        #info-panel h1 { color: #2196f3; font-size: 1.3em; margin-bottom: 10px; }
        #info-panel p { color: #aaa; font-size: 0.85em; line-height: 1.5; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        .control-btn { background: rgba(33,150,243,0.1); border: 1px solid #2196f3; color: #2196f3; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .control-btn:hover { background: rgba(33,150,243,0.3); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>Data Ingestion Flows</h1>
        <p>Watch data flow from various sources (databases, APIs, files) into GCP storage and processing systems.</p>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="resetCamera()">Reset View</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, isAnimating = true;
        let sources = [], destinations = [], dataStreams = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const light = new THREE.PointLight(0x2196f3, 1, 100);
            light.position.set(0, 20, 10);
            scene.add(light);
            
            // Data sources (left side)
            const sourceData = [
                { y: 6, color: 0xff5722, name: 'Database' },
                { y: 2, color: 0x9c27b0, name: 'API' },
                { y: -2, color: 0x4caf50, name: 'Files' },
                { y: -6, color: 0xff9800, name: 'Streaming' }
            ];
            
            sourceData.forEach(s => {
                const geom = new THREE.ConeGeometry(1.5, 2, 4);
                const mat = new THREE.MeshPhongMaterial({ color: s.color, emissive: s.color, emissiveIntensity: 0.3 });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.set(-15, s.y, 0);
                mesh.rotation.z = Math.PI / 2;
                sources.push(mesh);
                scene.add(mesh);
            });
            
            // GCP destination (right side)
            const destGeom = new THREE.BoxGeometry(6, 12, 4);
            const destMat = new THREE.MeshPhongMaterial({ color: 0x2196f3, emissive: 0x2196f3, emissiveIntensity: 0.3, transparent: true, opacity: 0.7 });
            const dest = new THREE.Mesh(destGeom, destMat);
            dest.position.set(12, 0, 0);
            destinations.push(dest);
            scene.add(dest);
            
            // Data streams
            for (let i = 0; i < 100; i++) {
                const geom = new THREE.SphereGeometry(0.2);
                const sourceIdx = Math.floor(Math.random() * 4);
                const mat = new THREE.MeshBasicMaterial({ color: sourceData[sourceIdx].color });
                const stream = new THREE.Mesh(geom, mat);
                stream.userData = { sourceY: sourceData[sourceIdx].y, progress: Math.random(), speed: 0.01 + Math.random() * 0.02 };
                dataStreams.push(stream);
                scene.add(stream);
            }
            
            const grid = new THREE.GridHelper(40, 40, 0x2196f3, 0x1a1a2e);
            grid.position.y = -10;
            scene.add(grid);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                sources.forEach(s => s.rotation.x += 0.02);
                destinations.forEach(d => d.rotation.y += 0.005);
                
                dataStreams.forEach(stream => {
                    stream.userData.progress += stream.userData.speed;
                    if (stream.userData.progress > 1) stream.userData.progress = 0;
                    
                    const t = stream.userData.progress;
                    stream.position.x = -15 + 27 * t;
                    stream.position.y = stream.userData.sourceY * (1 - t);
                    stream.position.z = Math.sin(t * Math.PI * 2) * 2;
                });
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        function toggleAnimation() { isAnimating = !isAnimating; event.target.textContent = isAnimating ? 'Pause' : 'Resume'; }
        function resetCamera() { camera.position.set(0, 15, 30); controls.target.set(0, 0, 0); }
        
        init();
    </script>
</body>
</html>
